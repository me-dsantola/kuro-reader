name: Build YOMI Beta APK

on:
  push:
    branches: [refactor/kuro-reader-v2]
  workflow_dispatch:
    inputs:
      build_type:
        description: Tipo de APK Beta
        required: true
        type: choice
        default: release
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and build Beta ARM64
    if: github.ref == 'refs/heads/refactor/kuro-reader-v2'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_betaBuild: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Beta Debug
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Build Beta Release
        if: github.event_name == 'push' || inputs.build_type == 'release'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: KuroReader-Beta-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
