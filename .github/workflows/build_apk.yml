name: Build YOMI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar YOMI APK Release (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Instalar dependencias
        run: flutter pub get

      - name: 5. Compilar APK Release
        run: flutter build apk --release --split-per-abi

      - name: 6. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: YOMI-Android-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
